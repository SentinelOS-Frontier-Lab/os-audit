[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelos-audit"
version = "0.1.0"
description = "Did the agent act on a text that was never its owner's? Attribution of Unauthorised Directives by Input Tracing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "SentinelOS Frontier Lab" }]
keywords = ["ai agents", "prompt injection", "security", "audit", "provenance"]

[project.scripts]
os-audit = "os_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
os_audit = ["schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
